# Goal agent Consultation (R54). Install in a Covered repo as .github/workflows/goal-agent-consult.yml. The uses:
# SHA is the shared goal-agent-pin, the same full 40-hex goal-agent commit as the gate's; the Consultation runs
# from goal-agent at that commit as a composite action (ADR 0008).
# A question comment from an owner, member or collaborator that opens with `> *Question for <name> Goal agent.*`
# fires that agent's routine with the comment URL. The workflow writes nothing to the tracker; the sweep
# answers any question a failed or lost fire leaves.
name: Goal agent consult

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: goal-agent-consult-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  consult:
    name: Fire the consulted Goal agent
    # issue_comment also fires for PRs; Consultations live on issues.
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    # One step only: the env below reaches every step in this job's action, and no other step may run beside it.
    steps:
      - uses: hsmejky/goal-agent/.github/actions/consult@1682c8b412fe63d22e635fa3791580c27abbb8a7
        env:
          # One FIRE_TOKEN/TRIGGER_ID pair per installed Goal agent: installing one adds its pair here. Never use
          # toJSON(secrets) or secrets: inherit: the action gets only the pairs named here.
          GOAL_AGENT_GOAL_STEWARD_FIRE_TOKEN: ${{ secrets.GOAL_AGENT_GOAL_STEWARD_FIRE_TOKEN }}
          GOAL_AGENT_GOAL_STEWARD_TRIGGER_ID: ${{ secrets.GOAL_AGENT_GOAL_STEWARD_TRIGGER_ID }}
