# Goal review gate (R37). Install in a Covered repo as .github/workflows/goal-agent-review.yml. The uses: SHA is
# the shared goal-agent-pin, a full 40-hex goal-agent commit; the gate runs from goal-agent at that commit as a
# composite action (ADR 0008), and nothing is copied into the Covered repo.
# Trust: pull_request_target only; the action checks out the default branch and runs nothing from the PR.
name: Goal agent review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  # A label change re-gates every open PR in this repo that closes the issue.
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

# One group per PR and event kind: a comment run never cancels a pull_request_target run.
concurrency:
  group: goal-agent-review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  gate:
    name: Goal review gate
    # issue_comment also fires for plain issues; only PR comments matter.
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    # One step only: the env below reaches every step in this job's action, and no other step may run beside it.
    steps:
      - uses: hsmejky/goal-agent/.github/actions/gate@1682c8b412fe63d22e635fa3791580c27abbb8a7
        env:
          # One FIRE_TOKEN/TRIGGER_ID pair per installed Goal agent: installing one adds its pair here. Never use
          # toJSON(secrets) or secrets: inherit: the action gets only the pairs named here.
          GOAL_AGENT_GOAL_STEWARD_FIRE_TOKEN: ${{ secrets.GOAL_AGENT_GOAL_STEWARD_FIRE_TOKEN }}
          GOAL_AGENT_GOAL_STEWARD_TRIGGER_ID: ${{ secrets.GOAL_AGENT_GOAL_STEWARD_TRIGGER_ID }}
