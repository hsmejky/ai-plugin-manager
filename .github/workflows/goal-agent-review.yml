name: Goal agent review

# Sets the commit status `goal-agent-review` on a PR's head SHA.
# See docs/agents/goal-agents.md, section "Goal review".
# pull_request_target and issue_comment run this file from the default branch, so the gate works only once it is
# on main. pull_request_target gives fork PRs a token that can write statuses. The job checks out only the default
# branch and never runs anything from the PR.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: goal-agent-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  status:
    name: Goal review status
    # An issue_comment on a plain issue has nothing to gate.
    if: github.event_name == 'pull_request_target' || github.event_name == 'issues' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Run the default branch's script, never code from the PR.
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Set the goal-agent-review status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/goal-agent-review.mjs
