name: Offline tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Markdown links
        run: node --test test/markdown-links.test.mjs
      - name: Doc sync
        run: node --test test/doc-sync.test.mjs
      - name: check-setup skill
        run: node --test skills/check-setup/scripts/test/*.test.mjs
      - name: setup skill
        run: node --test skills/setup/scripts/test/*.test.mjs
